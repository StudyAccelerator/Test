<!DOCTYPE html>
<!-- Classroom / landing cover: Study Academy + Hot Seat. 1460 x 752. Render:
  chromium --headless=new --no-sandbox --screenshot=study-academy.png --window-size=1460,752 --hide-scrollbars file://$PWD/study-academy-src.html -->
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1460px;height:752px;overflow:hidden}
body{background:linear-gradient(135deg,#2E2557 0%,#3d3370 100%);font-family:Georgia,'Times New Roman',serif;position:relative}
.glow{position:absolute;top:-200px;left:560px;width:900px;height:560px;background:radial-gradient(ellipse,rgba(201,169,110,.20),transparent 70%)}
.text{position:absolute;left:96px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#C9A96E;font-weight:700}
h1{margin-top:22px;font-size:92px;line-height:1;color:#FBF8F3;font-weight:700}
h1 em{color:#C9A96E}
.sub{margin-top:26px;font-family:'Helvetica Neue',Arial,sans-serif;font-size:26px;line-height:1.45;color:rgba(251,248,243,.82)}
.grid{position:absolute;right:96px;top:96px;width:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{height:172px;border-radius:14px;background:#1f1a3d;border:2px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;position:relative;font-family:'Helvetica Neue',Arial,sans-serif;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.av{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff}
.name{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;font-size:14px;padding:3px 9px;border-radius:6px}
.mic{position:absolute;right:12px;bottom:10px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}
.host{background:#FBF8F3;border-color:#C9A96E}
.host .av{background:#2E2557;color:#C9A96E;font-family:Georgia,serif;font-size:22px;width:86px;height:86px}
.hot{background:linear-gradient(160deg,#C9A96E,#b58f4f);border-color:#fff;transform:scale(1.06);z-index:2}
.hot .av{background:#2E2557;color:#FBF8F3}
.hot .name{background:#2E2557;color:#C9A96E;font-weight:800;letter-spacing:.06em}
.flame{position:absolute;top:-22px;right:-14px;width:54px;height:54px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#e2572b;transform:rotate(-45deg);box-shadow:0 0 0 6px #2E2557}
.flame::after{content:'';position:absolute;left:14px;top:16px;width:26px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#f6b23c}
.caption{position:absolute;right:96px;bottom:70px;width:620px;display:flex;justify-content:space-between;font-family:'Helvetica Neue',Arial,sans-serif;font-size:18px;color:rgba(251,248,243,.7)}
.caption b{color:#C9A96E}
</style></head><body>
<div class="glow"></div>
<div class="text">
  <div class="eyebrow">Every Wednesday · 7pm to 9pm</div>
  <h1>Study Academy <em>+ Hot Seat</em></h1>
  <p class="sub">Hour one: one method, taught properly. Hour two: your problem, fixed live.</p>
</div>
<div class="grid">
  <div class="tile host"><div class="av">Dr W</div><span class="name" style="background:#2E2557">Dr Waleed</span></div>
  <div class="tile"><div class="av" style="background:#4f9a6a">A</div><span class="name">Aisha</span><span class="mic"></span></div>
  <div class="tile"><div class="av" style="background:#6b5fb0">J</div><span class="name">Josh</span><span class="mic"></span></div>
  <div class="tile"><div class="av" style="background:#8a3b57">M</div><span class="name">Maya</span><span class="mic"></span></div>
  <div class="tile hot"><div class="flame"></div><div class="av">T</div><span class="name">HOT SEAT</span></div>
  <div class="tile"><div class="av" style="background:#c94a4a">S</div><span class="name">Sam</span><span class="mic"></span></div>
</div>
<div class="caption"><span><b>7pm</b> Study Academy</span><span><b>8pm</b> Hot Seat</span><span>Recorded the same night</span></div>
</body></html>
