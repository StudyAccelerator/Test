<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden}
body{background:radial-gradient(circle at 50% 38%,#4a3f85 0%,#2E2557 65%);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;position:relative}
.ring{position:absolute;inset:96px;border-radius:50%;border:6px solid rgba(201,169,110,.55)}
.inner{text-align:center;position:relative}
.top{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:58px;letter-spacing:.32em;color:#FBF8F3;padding-left:.32em}
.pct{font-size:330px;font-weight:700;line-height:.95;color:#C9A96E;letter-spacing:-.03em}
.sub{margin-top:14px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:46px;letter-spacing:.22em;color:#FBF8F3;padding-left:.22em}
.dr{margin-top:22px;font-style:italic;font-size:44px;color:rgba(251,248,243,.75)}
</style></head><body>
<div class="ring"></div>
<div class="inner"><div class="top">TOP</div><div class="pct">1%</div><div class="sub">STUDY GROUP</div><div class="dr">with Dr Waleed</div></div>
</body></html>
